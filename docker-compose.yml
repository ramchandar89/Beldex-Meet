# Local LiveKit media server for development.
# Start with: docker compose up   (or: npm run livekit)
# Dev mode pre-configures the API key/secret pair `devkey` / `secret`,
# which matches .env.local.
services:
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    restart: unless-stopped
    ports:
      - "7880:7880" # signaling (WebSocket / HTTP)
      - "7881:7881" # TCP fallback for WebRTC
      - "7882:7882/udp" # primary WebRTC media (RTP/RTCP)
